<!DOCTYPE html>
<html>
<head>
  <title>GPA Calculator</title>
</head>
<body>
  <h3>Standard (Academic) classes</h3>
  <h3>As</h3><input id="sa" type="number" value="0">
  <h3>Bs</h3><input id="sb" type="number" value="0">
  <h3>Cs</h3><input id="sc" type="number" value="0">
  <h3>Ds</h3><input id="sd" type="number" value="0">
  <h3>Fs</h3><input id="sf" type="number" value="0">

  <h3>Honors classes</h3>
  <h3>As</h3><input id="ha" type="number" value="0">
  <h3>Bs</h3><input id="hb" type="number" value="0">
  <h3>Cs</h3><input id="hc" type="number" value="0">
  <h3>Ds</h3><input id="hd" type="number" value="0">
  <h3>Fs</h3><input id="hf" type="number" value="0">

  <h3>AP classes</h3>
  <h3>As</h3><input id="aa" type="number" value="0">
  <h3>Bs</h3><input id="ab" type="number" value="0">
  <h3>Cs</h3><input id="ac" type="number" value="0">
  <h3>Ds</h3><input id="ad" type="number" value="0">
  <h3>Fs</h3><input id="af" type="number" value="0">

  <h1 id="result">GPA: ___</h1>

  <script>
function g(id) { return document.getElementById(id) };
function gg(id, s)
{
  return g(id + "a").valueAsNumber * s
  + g(id + "b").valueAsNumber * (s-1)
  + g(id + "c").valueAsNumber * (s-2)
  + g(id + "d").valueAsNumber * (s-3)
  + g(id + "f").valueAsNumber * 0
}
function gt(id) {
  return g(id + "a").valueAsNumber
  + g(id + "b").valueAsNumber
  + g(id + "c").valueAsNumber
  + g(id + "d").valueAsNumber
  + g(id + "f").valueAsNumber
  }

let result = g("result");
function compute()
{
  result.innerText = "GPA: " + (gg("s", 4) + gg("h", 4.5) + gg("a", 5)) / (gt("s") + gt("h") + gt("a"));
}
addEventListener("keypress", compute);
addEventListener("click", compute);
  </script>
</body>
</html>
