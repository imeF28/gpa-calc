<!DOCTYPE html>
<html>
<head>
  <title>GPA Calculator</title>
</head>
<body>
  <h3>Standard (Academic) classes</h3>
  <h3>As</h3><input id="sa" type="number">
  <h3>Bs</h3><input id="sb" type="number">
  <h3>Cs</h3><input id="sc" type="number">
  <h3>Ds</h3><input id="sd" type="number">
  <h3>Fs</h3><input id="sf" type="number">

  <h3>Honors classes</h3>
  <h3>As</h3><input id="ha" type="number">
  <h3>Bs</h3><input id="hb" type="number">
  <h3>Cs</h3><input id="hc" type="number">
  <h3>Ds</h3><input id="hd" type="number">
  <h3>Fs</h3><input id="hf" type="number">

  <h3>AP classes</h3>
  <h3>As</h3><input id="aa" type="number">
  <h3>Bs</h3><input id="ab" type="number">
  <h3>Cs</h3><input id="ac" type="number">
  <h3>Ds</h3><input id="ad" type="number">
  <h3>Fs</h3><input id="af" type="number">

  <h3>Honors classes</h3>
  <input id="honors" type="number">

  <h3>AP classes</h3>
  <input id="ap" type="number">

  <h1 id="result">GPA: ___</h1>

  <script>
function g(id) { return document.getElementById(id) };
function ga(id) { g(id + "a").value + g(id + "b").value + g(id + "c").value + g(id + "d").value + g(id + "e").value }

addEventListener("keypress", () => {
  result.innerText = "GPA: " + (ga("s") * 4 + ga("h") * 4.5 + ga("a") * 5) / (ga("s") + ga("h") + ga("a"));
});
  </script>
</body>
</html>
